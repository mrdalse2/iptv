name: Publish SBS Cookie 3.7 APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-sbs-cookie-3.7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2fe2ddb47b12d955ffc7801adc3b0533455d74f1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build 3.7 cookie APK
        working-directory: android-sbsplus-proxy
        run: gradle assembleDebug --stacktrace

      - name: Prepare test APK asset
        run: cp android-sbsplus-proxy/app/build/outputs/apk/debug/app-debug.apk LocalIPTVProxy-3.7-cookie.apk

      - name: Upload separate test asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload localiptvproxy-v2.2 LocalIPTVProxy-3.7-cookie.apk --clobber
