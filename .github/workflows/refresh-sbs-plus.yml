name: Refresh SBS Plus

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "fix_sbs_plus.py"
      - ".github/workflows/refresh-sbs-plus.yml"
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: refresh-sbs-plus
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve and validate SBS Plus
        run: python fix_sbs_plus.py

      - name: Show resolver result
        run: |
          grep "SBS Plus FINAL" official-channel-report.txt || true
          grep -A2 -B1 "SBS Plus" kr-tivimate.m3u || true

      - name: Commit SBS Plus refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kr-tivimate.m3u official-channel-report.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh SBS Plus route"
          git push
