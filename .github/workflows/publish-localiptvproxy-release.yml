name: Publish Local IPTV Proxy APK

on:
  push:
    branches:
      - main
    paths:
      - 'android-sbsplus-proxy/**'
      - '.github/workflows/publish-localiptvproxy-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build current APK
        working-directory: android-sbsplus-proxy
        run: gradle assembleDebug --stacktrace

      - name: Prepare stable APK asset
        run: cp android-sbsplus-proxy/app/build/outputs/apk/debug/app-debug.apk LocalIPTVProxy-2.2-mdns.apk

      - name: Create or update fixed GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='localiptvproxy-v2.2'
          TITLE='Local IPTV Proxy (Latest)'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" LocalIPTVProxy-2.2-mdns.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes 'Stable download path. File name stays fixed; APK contents track the latest main build.'
          else
            gh release create "$TAG" LocalIPTVProxy-2.2-mdns.apk \
              --title "$TITLE" \
              --notes 'Stable download path. File name stays fixed; APK contents track the latest main build.'
          fi
