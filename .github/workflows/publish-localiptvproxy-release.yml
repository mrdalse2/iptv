name: Publish Local IPTV Proxy APK

on:
  push:
    branches:
      - main
    paths:
      - 'android-sbsplus-proxy/**'
      - '.github/workflows/publish-localiptvproxy-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build current APK
        working-directory: android-sbsplus-proxy
        run: gradle assembleDebug --stacktrace

      - name: Prepare current APK
        run: cp android-sbsplus-proxy/app/build/outputs/apk/debug/app-debug.apk LocalIPTVProxy-2.2-mdns.apk

      - name: Build exact legacy 302 APK
        run: |
          git worktree add /tmp/legacy302 77840b7fdd9f71c13f3c7f6ddef5ec04e9e9ec87
          sed -i "s/versionCode 1/versionCode 99/" /tmp/legacy302/android-sbsplus-proxy/app/build.gradle
          sed -i "s/versionName '1.0.0'/versionName '1.0.302-test'/" /tmp/legacy302/android-sbsplus-proxy/app/build.gradle
          cd /tmp/legacy302/android-sbsplus-proxy
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Legacy-302-SBSPlusProxy.apk"

      - name: Create or update fixed GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='localiptvproxy-v2.2'
          TITLE='Local IPTV Proxy (Latest)'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" LocalIPTVProxy-2.2-mdns.apk Legacy-302-SBSPlusProxy.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes 'Stable download path. Latest proxy APK plus a temporary legacy 302 test APK.'
          else
            gh release create "$TAG" LocalIPTVProxy-2.2-mdns.apk Legacy-302-SBSPlusProxy.apk \
              --title "$TITLE" \
              --notes 'Stable download path. Latest proxy APK plus a temporary legacy 302 test APK.'
          fi
