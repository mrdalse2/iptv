name: Publish Local IPTV Proxy APK

on:
  push:
    branches:
      - main
    paths:
      - 'android-sbsplus-proxy/**'
      - '.github/workflows/publish-localiptvproxy-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build current APK
        working-directory: android-sbsplus-proxy
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK assets
        run: |
          cp android-sbsplus-proxy/app/build/outputs/apk/debug/app-debug.apk LocalIPTVProxy-2.2-mdns.apk
          cp android-sbsplus-proxy/app/build/outputs/apk/debug/app-debug.apk LocalIPTVProxy-4.1-2.8-relay.apk

      - name: Create or update fixed GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='localiptvproxy-v2.2'
          TITLE='Local IPTV Proxy (Latest)'
          NOTES='4.1 restores the smooth 2.8-style local HLS relay: child requests are remapped to the latest signed SBS root before upstream access, a fresh root is warmed asynchronously, child session parameters such as solsessionid are preserved, and current SBS Plus path-switch handling remains enabled. Stable 2.2 filename is retained for compatibility; LocalIPTVProxy-4.1-2.8-relay.apk is the explicit test build.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" LocalIPTVProxy-2.2-mdns.apk LocalIPTVProxy-4.1-2.8-relay.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" LocalIPTVProxy-2.2-mdns.apk LocalIPTVProxy-4.1-2.8-relay.apk \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
