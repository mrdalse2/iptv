name: Remote SBS Probe

on:
  push:
    branches:
      - main
      - diag/remote-sbs-probe
    paths:
      - '.github/workflows/remote-sbs-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe SBS Plus discovery and HLS remotely
        shell: python
        run: |
          import json, urllib.request, urllib.error, urllib.parse, datetime, builtins

          report = []
          def log(*args):
              line = ' '.join(str(x) for x in args)
              builtins.print(line)
              report.append(line)

          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          REFERERS = ['https://www.sbs.co.kr/live/S03', 'https://www.sbs.co.kr/enter/plus']
          ORIGIN = 'https://www.sbs.co.kr'

          def request(url, headers=None, limit=1024*1024, range_probe=False):
              h = {'User-Agent': UA, 'Accept': '*/*'}
              if headers: h.update(headers)
              if range_probe: h['Range'] = 'bytes=0-4095'
              req = urllib.request.Request(url, headers=h)
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.status, dict(r.headers.items()), r.read(limit), r.geturl()
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers.items()), e.read(65536), e.geturl()
              except Exception as e:
                  return None, {}, str(e).encode(), url

          def all_media(x, out=None):
              out = out if out is not None else []
              if isinstance(x, dict):
                  for k,v in x.items():
                      if k.lower() in ('mediaurl','media_url') and isinstance(v,str) and v.startswith(('http://','https://')):
                          out.append(v)
                      all_media(v,out)
              elif isinstance(x,list):
                  for v in x: all_media(v,out)
              return list(dict.fromkeys(out))

          def summary(url):
              if not url: return 'none'
              p=urllib.parse.urlsplit(url); q=urllib.parse.parse_qs(p.query)
              return f'host={p.hostname},path={p.path},token={"token" in q},solsessionid={"solsessionid" in q}'

          def lines(body):
              return [x.strip() for x in body.decode('utf-8','replace').splitlines() if x.strip()]

          def first_uri(base, ls, stream=False):
              if stream:
                  for i,x in enumerate(ls):
                      if x.startswith('#EXT-X-STREAM-INF') and i+1<len(ls) and not ls[i+1].startswith('#'):
                          return urllib.parse.urljoin(base,ls[i+1])
                  return None
              for x in ls:
                  if not x.startswith('#'): return urllib.parse.urljoin(base,x)
              return None

          def validate(label,url,headers):
              st,h,b,final=request(url,headers,256*1024)
              txt=b.decode('utf-8','replace')
              log(f'HLS {label}/playlist http={st} {summary(final)} extm3u={txt.lstrip().startswith("#EXTM3U")}')
              if st!=200 or not txt.lstrip().startswith('#EXTM3U'): return False
              ls=lines(b); variant=first_uri(final,ls,True); base=final
              if variant:
                  st,h,b,base=request(variant,headers,256*1024); txt=b.decode('utf-8','replace')
                  log(f'HLS {label}/variant http={st} {summary(base)} extm3u={txt.lstrip().startswith("#EXTM3U")}')
                  if st!=200 or not txt.lstrip().startswith('#EXTM3U'): return False
                  ls=lines(b)
              seg=first_uri(base,ls)
              if not seg: return False
              st,h,b,final=request(seg,headers,4096,True)
              log(f'HLS {label}/segment http={st} host={urllib.parse.urlsplit(final).hostname} bytes={len(b)}')
              return st in (200,206) and len(b)>0

          # Discover current SBS channel IDs/names instead of assuming S03.
          discovered=[]
          for kind,url in [
              ('regular','https://static.apis.sbs.co.kr/play-api/1.0/onair/channels'),
              ('virtual','https://static.apis.sbs.co.kr/play-api/1.0/onair/virtual/channels')]:
              st,h,b,final=request(url,{'Referer':REFERERS[0],'Origin':ORIGIN,'Accept':'application/json'})
              log(f'CHANNEL_LIST {kind} http={st}')
              try:
                  data=json.loads(b.decode('utf-8','replace'))
                  for item in data.get('list',[]):
                      cid=str(item.get('channelid','')); name=str(item.get('channelname',''))
                      if cid=='S03' or 'PLUS' in name.upper() or '플러스' in name:
                          discovered.append((kind,cid,name))
                          log(f'DISCOVER {kind} id={cid} name={name!r} onair={item.get("onair_yn")}')
              except Exception as e: log(f'CHANNEL_LIST_PARSE {kind} {e}')

          # Known aliases seen in SBS CDN/public integrations are probed too.
          ids=[]
          for kind,cid,name in discovered:
              if cid: ids.append((kind,cid))
          ids += [('regular','S03')]
          ids=list(dict.fromkeys(ids))

          endpoints=[]
          for kind,cid in ids:
              prefixes=['onair/channel'] if kind=='regular' else ['onair/virtual/channel']
              # Cross-check both endpoint families because SBS has moved IDs between them historically.
              prefixes += ['onair/virtual/channel'] if kind=='regular' else ['onair/channel']
              for prefix in prefixes:
                  for platform in ('pcweb','mobile'):
                      for ssl in ('N','Y'):
                          endpoints.append((f'{prefix}/{cid}/{platform}/{ssl}',f'https://apis.sbs.co.kr/play-api/1.0/{prefix}/{cid}?v_type=2&platform={platform}&protocol=hls&ssl={ssl}&rscuse=&jwt-token=&sbsmain='))

          # Livestream path aliases, including the actual CDN naming convention.
          aliases=[('S03','S03'),('sbspluspc','sbsplus0'),('sbspluspc','sbsplus')]
          for a,b in aliases:
              for ssl in ('N','Y'):
                  endpoints.append((f'livestream/{a}/{b}/{ssl}',f'https://apis.sbs.co.kr/play-api/1.0/livestream/{a}/{b}?protocol=hls&ssl={ssl}'))

          found=[]
          for label,url in endpoints:
              st,h,b,final=request(url,{'Referer':REFERERS[0],'Origin':ORIGIN,'Accept':'application/json,text/plain,*/*'})
              text=b.decode('utf-8','replace').strip(); medias=[]
              try:
                  if text.startswith(('{','[')): medias=all_media(json.loads(text))
                  elif text.startswith(('http://','https://')): medias=[text]
              except Exception: pass
              log(f'API {label} http={st} media_count={len(medias)}')
              for media in medias:
                  log(f'MEDIA {label} {summary(media)}')
                  found.append((label,media))

          valid=[]
          for label,media in found:
              candidates=[('api',media)]
              p=urllib.parse.urlsplit(media)
              if p.path.endswith('/playlist.m3u8'):
                  candidates.append(('chunklist',urllib.parse.urlunsplit((p.scheme,p.netloc,p.path[:-13]+'chunklist.m3u8',p.query,p.fragment))))
              for cname,url in candidates:
                  for r in REFERERS:
                      headers={'Referer':r,'Origin':ORIGIN}
                      tag=f'{label}/{cname}/{urllib.parse.urlsplit(r).path}'
                      if validate(tag,url,headers):
                          valid.append((tag,url)); log(f'VALID {tag} {summary(url)}')

          log(f'VALID_COUNT={len(valid)}')
          log('VALID_SOURCES=' + (','.join(x[0] for x in valid) if valid else 'none'))
          with open('sbs-probe-report.txt','w',encoding='utf-8') as f:
              f.write('generated_utc='+datetime.datetime.now(datetime.timezone.utc).isoformat()+'\n')
              f.write('\n'.join(report)+'\n')

      - name: Persist probe report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sbs-probe-report.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'diag: update SBS remote probe report'
          git push
