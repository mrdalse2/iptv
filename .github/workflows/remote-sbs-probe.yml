name: Remote SBS Probe

on:
  push:
    branches:
      - main
      - diag/remote-sbs-probe
    paths:
      - '.github/workflows/remote-sbs-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe SBS API and HLS remotely
        shell: python
        run: |
          import json, urllib.request, urllib.error, urllib.parse

          DESKTOP_UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          MOBILE_UA = 'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/131 Mobile Safari/537.36'
          REFERER = 'https://www.sbs.co.kr/live/S03'
          ORIGIN = 'https://www.sbs.co.kr'

          endpoints = []
          for platform in ('pcweb', 'mobile'):
              for ssl in ('N', 'Y'):
                  endpoints.append((f'onair-{platform}-{ssl}', f'https://apis.sbs.co.kr/play-api/1.0/onair/channel/S03?v_type=2&platform={platform}&protocol=hls&ssl={ssl}&rscuse=&jwt-token=&sbsmain='))
          endpoints += [
              ('livestream-Y', 'https://apis.sbs.co.kr/play-api/1.0/livestream/S03/S03?protocol=hls&ssl=Y'),
              ('livestream-N', 'https://apis.sbs.co.kr/play-api/1.0/livestream/S03/S03?protocol=hls&ssl=N'),
          ]

          def request(url, headers=None, limit=1024*1024, ua=DESKTOP_UA, range_probe=False):
              h = {'User-Agent': ua, 'Accept': '*/*'}
              if headers:
                  h.update(headers)
              if range_probe:
                  h['Range'] = 'bytes=0-4095'
              req = urllib.request.Request(url, headers=h)
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      body = r.read(limit)
                      return r.status, dict(r.headers.items()), body, r.geturl()
              except urllib.error.HTTPError as e:
                  body = e.read(65536)
                  return e.code, dict(e.headers.items()), body, e.geturl()
              except Exception as e:
                  return None, {}, str(e).encode(), url

          def find_media(x):
              if isinstance(x, dict):
                  for k in ('mediaurl','mediaUrl','media_url'):
                      v = x.get(k)
                      if isinstance(v, str) and v.startswith(('http://','https://')):
                          return v
                  for v in x.values():
                      found = find_media(v)
                      if found:
                          return found
              elif isinstance(x, list):
                  for v in x:
                      found = find_media(v)
                      if found:
                          return found
              return None

          def summarize_url(url):
              if not url:
                  return 'none'
              p = urllib.parse.urlsplit(url)
              q = urllib.parse.parse_qs(p.query)
              return f'host={p.hostname}, path={p.path}, queryPresent={bool(p.query)}, tokenPresent={"token" in q}, solsessionidPresent={"solsessionid" in q}'

          def hls_lines(body):
              return [ln.strip() for ln in body.decode('utf-8','replace').splitlines() if ln.strip()]

          def first_uri(base, lines, after_stream_inf=False):
              if after_stream_inf:
                  for i, line in enumerate(lines):
                      if line.startswith('#EXT-X-STREAM-INF') and i + 1 < len(lines):
                          nxt = lines[i + 1]
                          if not nxt.startswith('#'):
                              return urllib.parse.urljoin(base, nxt)
              for line in lines:
                  if not line.startswith('#'):
                      return urllib.parse.urljoin(base, line)
              return None

          def validate_hls(label, media, extra, ua):
              status, headers, body, final = request(media, extra, 256 * 1024, ua=ua)
              text = body.decode('utf-8','replace')
              print(f'HLS {label}/playlist: http={status}, final={summarize_url(final)}, type={headers.get("Content-Type","")}, extm3u={text.lstrip().startswith("#EXTM3U")}')
              if status != 200 or not text.lstrip().startswith('#EXTM3U'):
                  return False

              lines = hls_lines(body)
              variant = first_uri(final, lines, after_stream_inf=True)
              media_playlist_url = final
              if variant:
                  vstatus, vheaders, vbody, vfinal = request(variant, extra, 256 * 1024, ua=ua)
                  vtext = vbody.decode('utf-8','replace')
                  print(f'HLS {label}/variant: http={vstatus}, final={summarize_url(vfinal)}, type={vheaders.get("Content-Type","")}, extm3u={vtext.lstrip().startswith("#EXTM3U")}')
                  if vstatus != 200 or not vtext.lstrip().startswith('#EXTM3U'):
                      return False
                  lines = hls_lines(vbody)
                  media_playlist_url = vfinal

              segment = first_uri(media_playlist_url, lines, after_stream_inf=False)
              if not segment:
                  print(f'HLS {label}/segment: none')
                  return False
              sstatus, sheaders, sbody, sfinal = request(segment, extra, 4096, ua=ua, range_probe=True)
              print(f'HLS {label}/segment: http={sstatus}, finalHost={urllib.parse.urlsplit(sfinal).hostname}, bytes={len(sbody)}, type={sheaders.get("Content-Type","")}')
              return sstatus in (200, 206) and len(sbody) > 0

          found = {}
          for name, url in endpoints:
              ua = MOBILE_UA if 'mobile' in name else DESKTOP_UA
              status, headers, body, final = request(url, {'Referer': REFERER, 'Origin': ORIGIN, 'Accept': 'application/json,text/plain,*/*'}, ua=ua)
              text = body.decode('utf-8','replace').strip()
              media = None
              try:
                  if text.startswith('{') or text.startswith('['):
                      media = find_media(json.loads(text))
                  elif text.startswith(('http://','https://')):
                      media = text
              except Exception:
                  pass
              cookie_present = any(k.lower() == 'set-cookie' for k in headers)
              print(f'API {name}: http={status}, finalHost={urllib.parse.urlsplit(final).hostname}, cookiePresent={cookie_present}, media={summarize_url(media)}')
              if media:
                  found[name] = (media, ua)

          valid = []
          profiles = [
              ('referer-origin', {'Referer': REFERER, 'Origin': ORIGIN}),
              ('referer-only', {'Referer': REFERER}),
              ('minimal', {}),
          ]
          for source, (media, ua) in found.items():
              candidates = [('api-url', media)]
              p = urllib.parse.urlsplit(media)
              if p.path.endswith('/playlist.m3u8'):
                  candidates.append(('chunklist-same-query', urllib.parse.urlunsplit((p.scheme, p.netloc, p.path[:-len('playlist.m3u8')] + 'chunklist.m3u8', p.query, p.fragment))))
              elif p.path.endswith('/chunklist.m3u8'):
                  candidates.append(('playlist-same-query', urllib.parse.urlunsplit((p.scheme, p.netloc, p.path[:-len('chunklist.m3u8')] + 'playlist.m3u8', p.query, p.fragment))))

              for cname, candidate in candidates:
                  for pname, extra in profiles:
                      label = f'{source}/{cname}/{pname}'
                      if validate_hls(label, candidate, extra, ua):
                          valid.append(label)
                          print(f'VALID {label} media={summarize_url(candidate)}')

          print(f'VALID_COUNT={len(valid)}')
          if valid:
              print('VALID_SOURCES=' + ','.join(valid))
          else:
              print('VALID_SOURCES=none')
