name: SBS Public CDN Candidate Probe
on:
  push:
    branches: [diag/sbs-player-trace]
    paths: ['.github/workflows/sbs-public-cdn-candidate-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe bounded SBS Plus official CDN candidates
        shell: python
        run: |
          import urllib.request, urllib.error
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          REF='https://www.sbs.co.kr/live/S03'
          candidates=[
            'https://tvlive.sbs.co.kr/sbspluspc/sbsplus0.stream/playlist.m3u8',
            'https://tvlive.sbs.co.kr/sbspluspc/sbsplus0.stream/chunklist.m3u8',
            'https://tvlive.sbs.co.kr/sbspluslla/llhls/hls/1080p/playlist.m3u8',
            'https://tvlive.sbs.co.kr/sbsplus/llhls/hls/1080p/playlist.m3u8',
            'https://tvlive.sbs.co.kr/sbspluspc/llhls/hls/1080p/playlist.m3u8',
          ]
          profiles=[
            ('minimal',{}),
            ('referer',{'Referer':REF}),
            ('referer-origin',{'Referer':REF,'Origin':'https://www.sbs.co.kr'}),
          ]
          for url in candidates:
            for name,extra in profiles:
              h={'User-Agent':UA,'Accept':'application/vnd.apple.mpegurl,application/x-mpegURL,*/*'}
              h.update(extra)
              req=urllib.request.Request(url,headers=h)
              try:
                with urllib.request.urlopen(req,timeout=10) as r:
                  b=r.read(128)
                  print(f'{url} profile={name} http={r.status} ctype={r.headers.get("Content-Type","")} m3u={b.lstrip().startswith(b"#EXTM3U")}')
              except urllib.error.HTTPError as e:
                print(f'{url} profile={name} http={e.code} ctype={e.headers.get("Content-Type","")}')
              except Exception as e:
                print(f'{url} profile={name} error={type(e).__name__}:{e}')
