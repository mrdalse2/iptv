name: Update Korea EPG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build_playlist.py"
      - "fix_sbs_plus.py"
      - "build_current_epg.py"
      - ".github/workflows/update-epg.yml"
  schedule:
    # Refresh streams and purge stale channel routes every 6 hours
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Refresh official live channels
        run: python build_playlist.py

      - name: Resolve SBS Plus strictly
        run: python fix_sbs_plus.py

      - name: Show official live resolver status
        run: cat official-channel-report.txt

      - name: Build multi-source Korea channel definition
        run: python build_current_epg.py prepare

      - name: Checkout iptv-org EPG engine
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: master
          path: epg-engine

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: epg-engine/package-lock.json

      - name: Install EPG engine dependencies
        working-directory: epg-engine
        run: npm ci

      - name: Grab fresh Korean EPG from all sources
        working-directory: epg-engine
        run: |
          npm run grab --- \
            --channels=../korea.channels.xml \
            --output=../fresh-source.xml \
            --days=3 \
            --maxConnections=3 \
            --timeout=45000

      - name: Select live source and remap IDs
        run: python build_current_epg.py finalize

      - name: Validate generated EPG
        run: |
          python - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse("kr-tivimate-epg.xml").getroot()
          channels = root.findall("channel")
          programmes = root.findall("programme")
          report = Path("epg-update-report.txt").read_text(encoding="utf-8")

          m = re.search(r"Effective EPG channels: (\d+)/(\d+)", report)
          if not m:
              raise SystemExit("Coverage summary missing")
          effective, total = map(int, m.groups())

          print("effective channels:", effective, "/", total)
          print("xml channels:", len(channels), "programmes:", len(programmes))

          if effective == 0 or not programmes:
              raise SystemExit("Generated EPG has no usable programme data")
          if len(channels) != effective:
              raise SystemExit("Coverage/report mismatch")
          PY

      - name: Commit updated playlist and guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kr-tivimate.m3u kr-tivimate-epg.xml epg-update-report.txt official-channel-report.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: update Korea playlist and EPG"
          git push
