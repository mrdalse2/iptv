name: Publish SBS Auth Fallback 3.9 APK

on:
  push:
    branches:
      - exp/sbs-auth-fallback-3.9
    paths:
      - 'android-sbsplus-proxy/**'
      - '.github/workflows/publish-sbs-auth-fallback-3.9.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build 3.9 authenticated fallback APK
        working-directory: android-sbsplus-proxy
        run: gradle assembleDebug --stacktrace
      - name: Prepare test APK
        run: cp android-sbsplus-proxy/app/build/outputs/apk/debug/app-debug.apk LocalIPTVProxy-3.9-auth-fallback.apk
      - name: Upload separate test asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload localiptvproxy-v2.2 LocalIPTVProxy-3.9-auth-fallback.apk --clobber
