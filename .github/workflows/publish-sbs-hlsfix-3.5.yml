name: Publish SBS HLS Fix 3.5 APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-sbs-hlsfix-3.5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b171cdbf34a9df798970ce74f16fb86b9279aaa8

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build 3.5 HLS fix APK
        working-directory: android-sbsplus-proxy
        run: gradle assembleDebug --stacktrace

      - name: Prepare test APK asset
        run: cp android-sbsplus-proxy/app/build/outputs/apk/debug/app-debug.apk LocalIPTVProxy-3.5-hlsfix.apk

      - name: Upload separate test asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload localiptvproxy-v2.2 LocalIPTVProxy-3.5-hlsfix.apk --clobber
