name: Build SBS Plus Android Proxy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-sbsplus-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact legacy 302 commit
        uses: actions/checkout@v4
        with:
          ref: 77840b7fdd9f71c13f3c7f6ddef5ec04e9e9ec87

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Mark installable legacy test version
        working-directory: android-sbsplus-proxy
        run: |
          sed -i "s/versionCode 1/versionCode 99/" app/build.gradle
          sed -i "s/versionName '1.0.0'/versionName '1.0.302-test'/" app/build.gradle

      - name: Build exact legacy 302 APK
        working-directory: android-sbsplus-proxy
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-sbsplus-proxy/app/build/outputs/apk/debug/app-debug.apk Legacy-302-SBSPlusProxy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Legacy-302-SBSPlusProxy
          path: Legacy-302-SBSPlusProxy.apk
          if-no-files-found: error
