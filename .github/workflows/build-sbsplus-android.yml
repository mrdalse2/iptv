name: Build SBS Plus Android Proxy

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-sbsplus-proxy
    paths:
      - 'android-sbsplus-proxy/**'
      - '.github/workflows/build-sbsplus-android.yml'
  pull_request:
    paths:
      - 'android-sbsplus-proxy/**'
      - '.github/workflows/build-sbsplus-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-sbsplus-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SBSPlusProxy-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SBSPlusProxy-debug-apk
          path: android-sbsplus-proxy/app/build/outputs/apk/debug/SBSPlusProxy-debug.apk
          if-no-files-found: error
